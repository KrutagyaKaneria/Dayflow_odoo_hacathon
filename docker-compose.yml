# Local development Postgres for Dayflow HRMS.
# Usage: docker compose up -d  (then run backend migrations)
services:
  postgres:
    image: postgres:16-alpine
    container_name: dayflow-postgres
    environment:
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow
      POSTGRES_DB: dayflow_dev
    ports:
      - "5432:5432"
    volumes:
      - dayflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dayflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dayflow_pgdata:
